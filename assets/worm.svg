<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-label="Animasi cacing merayap">
  <title>Cacing merayap</title>
  <desc>Seekor cacing hijau merayap mengikuti jalur bergelombang.</desc>

  <!-- makanan -->
  <g fill="#4ade80">
    <circle cx="150" cy="38" r="5">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="330" cy="104" r="5">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="520" cy="36" r="5">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="1.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="106" r="5">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="0.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="840" cy="40" r="5">
      <animate attributeName="opacity" values="1;.25;1" dur="2.4s" begin="1.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- rumput -->
  <g stroke="#22c55e" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7">
    <path d="M40 132 q4 -12 8 0" />
    <path d="M240 132 q4 -12 8 0" />
    <path d="M470 132 q4 -12 8 0" />
    <path d="M660 132 q4 -12 8 0" />
    <path d="M860 132 q4 -12 8 0" />
  </g>

  <!-- cacing -->
  <g>
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto" path="M -140 70 C 80 20, 260 120, 420 70 S 720 20, 1040 70" />

    <!-- ekor -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 4; 0 0" dur="0.9s" begin="-0.6s" repeatCount="indefinite" />
      <circle cx="-110" cy="0" r="8.5" fill="#14532d" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 4; 0 0" dur="0.9s" begin="-0.5s" repeatCount="indefinite" />
      <circle cx="-92" cy="0" r="10" fill="#166534" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 4; 0 0" dur="0.9s" begin="-0.4s" repeatCount="indefinite" />
      <circle cx="-74" cy="0" r="11" fill="#15803d" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 4; 0 0" dur="0.9s" begin="-0.3s" repeatCount="indefinite" />
      <circle cx="-56" cy="0" r="12" fill="#16a34a" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 4; 0 0" dur="0.9s" begin="-0.2s" repeatCount="indefinite" />
      <circle cx="-38" cy="0" r="13" fill="#22c55e" />
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 4; 0 0" dur="0.9s" begin="-0.1s" repeatCount="indefinite" />
      <circle cx="-20" cy="0" r="14" fill="#4ade80" />
    </g>

    <!-- kepala -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0; 0 4; 0 0" dur="0.9s" begin="0s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="16" fill="#86efac" />
      <path d="M 2 -14 Q 0 -22 -4 -24" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" />
      <path d="M 10 -14 Q 12 -22 16 -24" stroke="#16a34a" stroke-width="2" fill="none" stroke-linecap="round" />
      <circle cx="-4" cy="-24" r="2" fill="#16a34a" />
      <circle cx="16" cy="-24" r="2" fill="#16a34a" />
      <circle cx="5" cy="-6" r="4" fill="#fff" />
      <circle cx="13" cy="-6" r="4" fill="#fff" />
      <circle cx="6" cy="-6" r="2" fill="#111827" />
      <circle cx="14" cy="-6" r="2" fill="#111827" />
      <path d="M 6 5 Q 11 10 16 5" stroke="#14532d" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>
